# kube-prometheus-stack trimmed for a small local kind cluster (4 GB VM).
alertmanager:
  enabled: false
nodeExporter:
  enabled: false
prometheus:
  prometheusSpec:
    retention: 1d
    serviceMonitorSelectorNilUsesHelmValues: false   # pick up ServiceMonitors from every release
    resources:
      requests: {cpu: 100m, memory: 300Mi}
      limits: {memory: 700Mi}
grafana:
  adminPassword: ""        # chart generates one; read it from the grafana secret
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
  resources:
    requests: {cpu: 50m, memory: 128Mi}
