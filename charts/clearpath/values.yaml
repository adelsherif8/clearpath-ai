# Offline demo mode: no API keys. Production runs on Cloud Run; this chart is for Kubernetes.
image:
  repository: clearpath
  tag: local
  pullPolicy: IfNotPresent

replicaCount: 2          # ignored while autoscaling is on

config:
  CP_ENV: development
  ALLOWED_HOSTS: localhost,127.0.0.1,clearpath.local
  CP_DAILY_LLM_CALL_CAP: "200"

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: true
  className: nginx
  host: clearpath.local

metrics:
  enabled: true
  port: 9100
  serviceMonitor:
    enabled: false       # true once the Prometheus Operator CRDs are installed (kube-prometheus-stack)
    interval: 15s
  dashboard:
    enabled: false       # Grafana dashboard ConfigMap, for the kube-prometheus-stack Grafana sidecar

# Go reverse proxy in front of the app (services/gateway): per-client rate limit + its own metrics.
# When enabled, the Ingress sends traffic to the gateway instead of straight to the app.
gateway:
  enabled: true
  image:
    repository: clearpath-gateway
    tag: local
    pullPolicy: IfNotPresent
  replicas: 2
  ratePerSecond: 20
  burst: 40
  resources:
    requests: {cpu: 20m, memory: 16Mi}
    limits: {cpu: 200m, memory: 64Mi}

# ASP.NET Core reports API (services/reports): snapshots the app's eval results into SQLite (EF Core)
# on a PersistentVolumeClaim and serves /reports/summary, /reports/procedures, /reports/history.
reports:
  enabled: true
  image:
    repository: clearpath-reports
    tag: local
    pullPolicy: IfNotPresent
  snapshotEverySeconds: 300
  storage: 1Gi
  storageClassName: ""     # cluster default (local-path on kind)
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 300m, memory: 256Mi}
