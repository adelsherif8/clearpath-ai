{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels: {{- include "clearpath.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          env:
            - {name: UPSTREAM, value: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc"}
            - {name: RATE_PER_SECOND, value: {{ .Values.gateway.ratePerSecond | quote }}}
            - {name: BURST, value: {{ .Values.gateway.burst | quote }}}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "clearpath.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  selector: {app.kubernetes.io/name: gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: http, port: 80, targetPort: http}
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "clearpath.labels" . | nindent 4 }}
    release: monitoring
spec:
  selector:
    matchLabels: {app.kubernetes.io/component: gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
  endpoints:
    - port: http
      path: /gateway/metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- end }}
