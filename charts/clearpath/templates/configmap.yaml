apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels: {{- include "clearpath.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- if .Values.metrics.enabled }}
  PROMETHEUS_PORT: {{ .Values.metrics.port | quote }}
  {{- end }}
