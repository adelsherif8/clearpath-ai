{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "clearpath.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- if .Values.reports.enabled }}
          - path: /reports
            pathType: Prefix
            backend:
              service: {name: {{ .Release.Name }}-reports, port: {name: http}}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ if .Values.gateway.enabled }}{{ .Release.Name }}-gateway{{ else }}{{ .Release.Name }}{{ end }}, port: {name: http}}
{{- end }}
