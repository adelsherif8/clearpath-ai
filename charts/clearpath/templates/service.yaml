apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "clearpath.labels" . | nindent 4 }}
spec:
  selector: {{- include "clearpath.selector" . | nindent 4 }}
  ports:
    - {name: http, port: 80, targetPort: http}
    {{- if .Values.metrics.enabled }}
    - {name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics}
    {{- end }}
